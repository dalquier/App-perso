name: Design System Preview Smoke

on:
  pull_request:
    paths:
      - '.replit'
      - 'start-design-system-preview.sh'
      - 'apps/design-system/**'
      - 'ProjectOS/design-system/REPLIT_RUNTIME_CONTRACT.md'
      - '.github/workflows/design-system-preview-smoke.yml'
  workflow_dispatch:

jobs:
  direct-run-smoke:
    name: Design System Direct Run Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: apps/design-system/package-lock.json

      - name: Launch with Replit-equivalent command and verify Storybook
        env:
          PORT: '6006'
        run: |
          set -euo pipefail
          bash ./start-design-system-preview.sh > /tmp/design-system-storybook.log 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${PORT}/" > /tmp/storybook-index.html; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/design-system-storybook.log
            exit 1
          fi

          test -s /tmp/storybook-index.html
          curl -fsS "http://127.0.0.1:${PORT}/iframe.html" > /dev/null
          curl -fsS "http://127.0.0.1:${PORT}/index.json" > /dev/null
          grep -qi 'storybook' /tmp/storybook-index.html

      - name: Build immutable Replit ZIP snapshot
        run: |
          set -euo pipefail
          rm -rf runtime-package projectos-design-system-c1-replit.zip
          mkdir -p runtime-package/apps runtime-package/ProjectOS/design-system/tokens
          cp .replit runtime-package/.replit
          cp start-design-system-preview.sh runtime-package/start-design-system-preview.sh
          cp -R apps/design-system runtime-package/apps/design-system
          rm -rf runtime-package/apps/design-system/node_modules runtime-package/apps/design-system/storybook-static
          cp ProjectOS/design-system/tokens/design-tokens.json runtime-package/ProjectOS/design-system/tokens/design-tokens.json
          cp ProjectOS/design-system/REPLIT_RUNTIME_CONTRACT.md runtime-package/ProjectOS/design-system/REPLIT_RUNTIME_CONTRACT.md
          printf '%s\n' "$GITHUB_SHA" > runtime-package/RUNTIME_SOURCE_SHA.txt
          (cd runtime-package && zip -qr ../projectos-design-system-c1-replit.zip .)
          test -s projectos-design-system-c1-replit.zip

      - name: Upload Replit ZIP snapshot
        uses: actions/upload-artifact@v4
        with:
          name: projectos-design-system-c1-replit-${{ github.sha }}
          path: projectos-design-system-c1-replit.zip
          if-no-files-found: error
          retention-days: 7
