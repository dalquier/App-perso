name: ProjectOS Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile ProjectOS Python
        run: |
          python -m py_compile ProjectOS/scripts/*.py
          if compgen -G "ProjectOS/observability/pyto/*.py" > /dev/null; then
            python -m py_compile ProjectOS/observability/pyto/*.py
          fi
      - name: Run ProjectOS incident tooling tests
        run: |
          if test -f ProjectOS/scripts/test_incident_tools.py; then
            python ProjectOS/scripts/test_incident_tools.py
          fi
          if test -f ProjectOS/observability/pyto/test_incident_widget.py; then
            (cd ProjectOS/observability/pyto && python test_incident_widget.py)
          fi
      - name: Run doctor
        run: python ProjectOS/scripts/projectos.py doctor
      - name: Create and inspect backup
        run: |
          python ProjectOS/scripts/projectos.py backup
          test -n "$(find .projectos/backups -name '*.tar.gz' -print -quit)"
      - name: Reject committed secrets
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|token\.json|credentials\.json|secrets\.json)$'
