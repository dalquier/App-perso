name: DeveloperOS GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/developer-os/**"
      - ".github/workflows/developer-os-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: developer-os-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy DeveloperOS
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/developer-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: apps/developer-os/package-lock.json
      - name: Setup npm 11.4.2
        run: npm install -g npm@11.4.2
      - name: Install locked dependencies
        run: npm ci
      - name: Build DeveloperOS
        run: npm run build
      - name: Stage DeveloperOS under Pages subpath
        run: |
          rm -rf pages-root
          mkdir -p pages-root/developer-os
          cp -R dist/. pages-root/developer-os/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload DeveloperOS artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/developer-os/pages-root
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
